<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOTC Digital Town Square</title><link rel="stylesheet" href="styles.css"></head><body><div id="app">
<header class="topbar"><div class="brand">BOTC Digital Town Square</div><div class="topActions"><span id="headerSession"></span><button id="themeBtn" class="ghost">◐</button></div></header><main class="shell">
<section id="landing" class="card"><h1>Virtual Town Square & Grimoire</h1><p>Run a live, remote or in-room social-deduction session.</p><div class="grid2"><button id="playerMode" class="primary big">Join as Player</button><button id="gmMode" class="danger big">Storyteller</button></div></section>
<section id="playerJoin" class="card hidden"><h2>Join session</h2><label>4-digit session<input id="joinCode" maxlength="4" inputmode="numeric"></label><label>Display name<input id="joinName" maxlength="30"></label><label>Your 4-digit return PIN<input id="joinPin" maxlength="4" inputmode="numeric"></label><button id="joinBtn" class="primary">Join Town Square</button> <button class="back ghost">Back</button><p id="joinMsg" class="status"></p></section>
<section id="gmLogin" class="card hidden"><h2>Storyteller</h2><p>Sign in with the Google account that owns the session.</p><button id="googleBtn" class="primary">Sign in with Google</button> <button class="back ghost">Back</button><p id="gmMsg" class="status"></p></section>
<section id="playerApp" class="hidden"><div class="gameLayout"><div id="playerStage" class="stage"></div><aside class="side"><nav class="sideTabs"><button data-tab="identity">You</button><button data-tab="town">Town</button><button data-tab="action">Action</button><button data-tab="notes">Notes</button><button data-tab="chat">Chat</button></nav><div id="playerBanner"></div><div id="playerPanel" class="panel"></div></aside></div></section>
<section id="gmApp" class="hidden"><div class="gameLayout"><div id="gmStage" class="stage"></div><aside class="side"><div class="sideTabs"><button data-gmtab="setup">Setup</button><button data-gmtab="grimoire">Grimoire</button><button data-gmtab="night">Night</button><button data-gmtab="day">Day</button><button data-gmtab="messages">Info</button><button data-gmtab="chatcontrol">Chat</button><button data-gmtab="log">Log</button></div><div class="panel"><div id="gameCodeBadge"></div><div><button id="newGameBtn" class="primary">New session</button> <button id="signOutBtn" class="ghost">Sign out</button></div><div id="gmPanel"></div></div></aside></div></section>
</main><div class="footerNote">Unofficial community companion. Not affiliated with The Pandemonium Institute.</div></div><script type="module" src="app.js"></script></body></html>
